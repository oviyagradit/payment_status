# Runs Claude when someone writes "@claude ..." in a PR/issue comment.
# Example: comment "@claude test this project" on a PR.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only run for comments that mention @claude, and only from the repo owner/collaborators
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(npm *),Bash(npx *),Bash(node *),Bash(curl *),Bash(cd *),Bash(ls *),Bash(cat *),Read,Write,Edit,Glob,Grep,mcp__github_inline_comment__create_inline_comment"
